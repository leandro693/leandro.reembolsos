name: Run SQL Migration

# Executa um arquivo .sql de migração no banco do Supabase, usando a Management
# API e o mesmo segredo SUPABASE_ACCESS_TOKEN do deploy da função.
# Dispare em Actions > "Run SQL Migration" > Run workflow (escolha o arquivo).

on:
  workflow_dispatch:
    inputs:
      file:
        description: Arquivo .sql a executar
        required: true
        default: supabase-v3-fornecedor.sql
  push:
    branches: [ claude/app-opinion-u93e9u, main ]
    paths:
      - 'supabase-v3-fornecedor.sql'
      - '.github/workflows/run-sql-migration.yml'

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: fwoupyqojfxpipvidvsx
      SQL_FILE: ${{ github.event.inputs.file || 'supabase-v3-fornecedor.sql' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Executar SQL via Management API
        run: |
          set -euo pipefail
          if [ ! -f "$SQL_FILE" ]; then echo "Arquivo nao encontrado: $SQL_FILE"; exit 1; fi
          echo "Executando: $SQL_FILE"
          jq -Rs '{query: .}' "$SQL_FILE" > payload.json
          code=$(curl -sS -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_ID/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @payload.json -o resp.json -w "%{http_code}")
          echo "HTTP $code"
          echo "Resposta:"; cat resp.json; echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Falha ao executar a migracao."; exit 1
          fi
          echo "Migracao aplicada com sucesso."
