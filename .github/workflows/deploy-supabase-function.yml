name: Deploy Supabase Function

# Publica automaticamente as Edge Functions ("ler-comprovante" e
# "importar-erp") no Supabase a cada push, e também sob demanda
# (botão "Run workflow").
#
# Pré-requisito (feito UMA vez): criar um Access Token no Supabase
# (Account > Access Tokens) e cadastrá-lo neste repositório em
# Settings > Secrets and variables > Actions, com o nome SUPABASE_ACCESS_TOKEN.

on:
  push:
    branches: [ claude/app-opinion-u93e9u, main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: fwoupyqojfxpipvidvsx
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy ler-comprovante
        run: supabase functions deploy ler-comprovante --project-ref "$PROJECT_ID"

      - name: Deploy importar-erp
        run: supabase functions deploy importar-erp --project-ref "$PROJECT_ID"
